apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: {{ .Release.Name }}-fanout-inbox-item
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  action: DENY
  rules:
    - from:
        - source:
            notPrincipals:
              - "cluster.local/ns/{{ .Release.Namespace }}/sa/threads"
              - "cluster.local/ns/{{ .Release.Namespace }}/sa/threads-e2e"
      to:
        - operation:
            methods:
              - POST
            paths:
              - /agynio.api.agents.v1.AgentsService/FanoutInboxItem
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: {{ .Release.Name }}-update-sandbox-runtime-state
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  action: DENY
  rules:
    - from:
        - source:
            notPrincipals:
              - "cluster.local/ns/{{ .Release.Namespace }}/sa/agents-orchestrator"
      to:
        - operation:
            methods:
              - POST
            paths:
              - /agynio.api.agents.v1.AgentsService/UpdateSandboxRuntimeState
---
# PauseInstance is reachable both ways: the Orchestrator pauses on the
# platform's behalf with no identity, and a user pauses deliberately through the
# Gateway, which attaches theirs and is then held to can_manage in the service.
# So this narrows who may reach the RPC at all, rather than standing in for that
# check -- without it any workload in the mesh could pause any instance by
# simply omitting an identity.
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: {{ .Release.Name }}-pause-instance
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  action: DENY
  rules:
    - from:
        - source:
            notPrincipals:
              - "cluster.local/ns/{{ .Release.Namespace }}/sa/agents-orchestrator"
              - "cluster.local/ns/{{ .Release.Namespace }}/sa/gateway"
      to:
        - operation:
            methods:
              - POST
            paths:
              - /agynio.api.agents.v1.AgentsService/PauseInstance
---
# DeleteOrganizationResources is one step of the organization teardown. It has
# no caller identity to authorize, so who may reach it at all is settled here.
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: {{ .Release.Name }}-delete-organization-resources
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  action: DENY
  rules:
    - from:
        - source:
            notPrincipals:
              - "cluster.local/ns/{{ .Release.Namespace }}/sa/organizations"
      to:
        - operation:
            methods:
              - POST
            paths:
              - /agynio.api.agents.v1.AgentsService/DeleteOrganizationResources
